[graph]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
# Unmaintained notices with no upgrade, reached only through NSH's SVG renderer (nsh-core -> resvg -> usvg). Remove
# each entry when NSH stops depending on the crate; cargo-deny reports an ignore that no longer matches.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, only via NSH's resvg/usvg; no upgrade available" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained, only via NSH's resvg/usvg; no upgrade available" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# NSH is tracked from its main branch (AGENTS.md); Cargo.lock pins the exact commit.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/longbridge/nsh"]
