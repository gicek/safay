name: Desktop verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to the same branch or tag supersedes a run still in progress.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    # A cold run builds the NSH CLI and every dependency from source; cached runs skip most of it.
    timeout-minutes: 90
    env:
      # Line tables keep test backtraces readable while cutting link time and cache size for the many test binaries.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      # Restored before the NSH checkout exists: rust-cache hashes every rust-toolchain.toml and .cargo/config.toml it
      # finds, so a restored checkout would change the key and miss the cache.
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Pinned NSH commit
        id: nsh
        run: echo "commit=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import install_nsh; print(install_nsh.pinned_commit())')" >> "$GITHUB_OUTPUT"
      # The NSH checkout and its CLI, without the build's intermediate files; install_nsh.py keeps a CLI built from the
      # pinned commit.
      - name: NSH CLI cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nsh/toolchain/source
            !.nsh/toolchain/source/target
            .nsh/toolchain/source/target/release/nsh
          key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-rust-1.100.0-${{ steps.nsh.outputs.commit }}
      - name: Install pinned NSH
        run: python3 scripts/install_nsh.py
        env:
          # NSH's release profile is fat LTO with one codegen unit; CI only runs the CLI, so it skips that optimization.
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # The app's generated NSH workspace (development host, headless runner) builds into its own target directory.
      - name: NSH workspace cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nsh/rust/target
          key: nsh-rust-${{ runner.os }}-${{ runner.arch }}-rust-1.100.0-${{ steps.nsh.outputs.commit }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: nsh-rust-${{ runner.os }}-${{ runner.arch }}-rust-1.100.0-${{ steps.nsh.outputs.commit }}-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: NSH features
        run: make nsh-features
      - name: Launcher integrations are current
        run: python3 scripts/integrations.py --check
      - name: Rust and headless UI tests
        run: cargo test --workspace --locked
      - name: NSH type checks
        run: python3 scripts/nsh.py check
      - name: NSH headless tests
        run: python3 scripts/nsh.py test App.test.tsx
      - name: macOS native UI
        run: python3 scripts/nsh.py test App.test.tsx --target macos
      # Thin LTO with one codegen unit takes minutes; release tags check it, branch pushes skip it.
      - name: Production build
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo build --release --locked

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Advisories, licenses, bans and sources for every platform
        run: cargo deny --locked check
