[package]
name = "safay-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
safay-core = { path = "../safay-core" }
cloudset = "=0.2.0"
getrandom = "=0.4.3"
zeroize = "=1.9.0"
uuid = { version = "=1.26.1", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"

tempfile = "=3.27.0"

[dev-dependencies]
cloudset = { version = "=0.2.0", features = ["testing"] }
